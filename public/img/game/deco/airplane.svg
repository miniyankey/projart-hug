<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 32" shape-rendering="crispEdges">
  <!-- Lignes de vitesse -->
  <g fill="#bcd6ea">
    <rect x="0" y="15" width="4" height="1"/>
    <rect x="1" y="18" width="5" height="1"/>
    <rect x="0" y="21" width="3" height="1"/>
  </g>

  <!-- Cône de queue (raccordé au fuselage) -->
  <g fill="#eef3f8">
    <rect x="12" y="13" width="3" height="1"/>
    <rect x="10" y="14" width="6" height="1"/>
    <rect x="7"  y="15" width="9" height="1"/>
    <rect x="6"  y="16" width="10" height="1"/>
    <rect x="6"  y="17" width="10" height="1"/>
    <rect x="8"  y="18" width="8" height="1"/>
    <rect x="10" y="19" width="6" height="1"/>
    <rect x="12" y="20" width="4" height="1"/>
  </g>
  <rect x="6" y="16" width="1" height="2" fill="#cfd7df"/>

  <!-- Stabilisateur horizontal (à la pointe arrière) -->
  <rect x="6" y="13" width="5" height="1" fill="#b9c1c9"/>
  <rect x="3" y="14" width="8" height="2" fill="#9aa3ad"/>
  <rect x="3" y="14" width="8" height="1" fill="#b9c1c9"/>

  <!-- Dérive (queue) en flèche, posée sur le cône -->
  <g fill="#d8392b">
    <rect x="8"  y="3"  width="3" height="2"/>
    <rect x="8"  y="5"  width="4" height="1"/>
    <rect x="8"  y="6"  width="5" height="1"/>
    <rect x="8"  y="7"  width="6" height="1"/>
    <rect x="8"  y="8"  width="6" height="1"/>
    <rect x="9"  y="9"  width="6" height="1"/>
    <rect x="10" y="10" width="5" height="1"/>
    <rect x="11" y="11" width="4" height="1"/>
    <rect x="12" y="12" width="3" height="1"/>
  </g>
  <!-- bord de fuite foncé / bord d'attaque clair -->
  <rect x="8"  y="3"  width="1" height="6" fill="#8f2017"/>
  <g fill="#ee5446">
    <rect x="10" y="4" width="1" height="1"/>
    <rect x="11" y="6" width="1" height="1"/>
    <rect x="12" y="7" width="1" height="1"/>
    <rect x="13" y="8" width="1" height="1"/>
  </g>
  <!-- logo blanc -->
  <rect x="9" y="6" width="2" height="2" fill="#f5f5f5"/>

  <!-- Fuselage : contour -->
  <g fill="#9aa3ad">
    <rect x="16" y="11" width="26" height="1"/>
    <rect x="14" y="12" width="30" height="1"/>
    <rect x="14" y="21" width="30" height="1"/>
    <rect x="16" y="22" width="26" height="1"/>
  </g>
  <!-- corps -->
  <rect x="14" y="13" width="30" height="8" fill="#eef3f8"/>
  <!-- nez arrondi -->
  <g fill="#eef3f8">
    <rect x="44" y="14" width="2" height="6"/>
    <rect x="46" y="15" width="1" height="4"/>
  </g>
  <rect x="46" y="16" width="1" height="2" fill="#cfd7df"/>

  <!-- Reflet haut / ombre basse -->
  <rect x="14" y="13" width="30" height="1" fill="#ffffff"/>
  <rect x="14" y="20" width="30" height="1" fill="#c2cad3"/>
  <rect x="16" y="21" width="26" height="1" fill="#aab4bf"/>

  <!-- Bande déco (cheatline) -->
  <rect x="10" y="18" width="34" height="2" fill="#2a6fb5"/>
  <rect x="10" y="18" width="34" height="1" fill="#3b86d4"/>

  <!-- Hublots -->
  <g fill="#bfe3f5">
    <rect x="17" y="15" width="1" height="2"/>
    <rect x="20" y="15" width="1" height="2"/>
    <rect x="23" y="15" width="1" height="2"/>
    <rect x="26" y="15" width="1" height="2"/>
    <rect x="29" y="15" width="1" height="2"/>
    <rect x="32" y="15" width="1" height="2"/>
    <rect x="35" y="15" width="1" height="2"/>
  </g>
  <!-- Porte avant -->
  <rect x="38" y="14" width="2" height="4" fill="#cfd7df"/>
  <!-- Cockpit -->
  <rect x="42" y="14" width="2" height="2" fill="#173a5e"/>
  <rect x="41" y="13" width="1" height="1" fill="#173a5e"/>

  <!-- Aile arrière visible derrière le fuselage (profondeur) -->
  <rect x="27" y="20" width="9" height="1" fill="#7f8a96"/>

  <!-- Aile principale en flèche -->
  <g fill="#8b95a0">
    <rect x="22" y="21" width="9"  height="2"/>
    <rect x="19" y="23" width="9"  height="2"/>
    <rect x="16" y="25" width="8"  height="2"/>
    <rect x="13" y="27" width="7"  height="2"/>
  </g>
  <rect x="22" y="21" width="9" height="1" fill="#aab4be"/>
  <rect x="13" y="27" width="7" height="1" fill="#aab4be"/>
  <!-- Winglet -->
  <rect x="12" y="25" width="2" height="3" fill="#6f7984"/>

  <!-- Réacteur sous l'aile -->
  <rect x="22" y="24" width="8" height="5" fill="#3a4048"/>
  <rect x="22" y="24" width="8" height="1" fill="#5a616a"/>
  <rect x="30" y="25" width="1" height="3" fill="#9aa3ad"/>
  <rect x="21" y="26" width="1" height="2" fill="#1d2126"/>
</svg>
