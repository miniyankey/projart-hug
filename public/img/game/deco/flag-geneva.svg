  <g fill="#1a1a1a">
    <rect x="3" y="-37" width="6" height="2"/>
    <rect x="6" y="-35" width="4" height="7"/>
    <rect x="9" y="-37" width="3" height="2"/>
    <rect x="4" y="-29" width="3" height="2"/>
  </g>
  <!-- Clé jaune (côté rouge) -->
  <g fill="#e7c14a">
    <rect x="16" y="-37" width="4" height="3"/>
    <rect x="17" y="-34" width="2" height="9"/>
    <rect x="19" y="-28" width="3" height="2"/>
    <rect x="19" y="-32" width="2" height="2"/>
  </g>
</svg>
