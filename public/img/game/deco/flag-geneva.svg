<svg xmlns="http://www.w3.org/2000/svg" viewBox="-32 -44 64 92" shape-rendering="crispEdges">
  <rect x="-4" y="42" width="12" height="2" fill="#00000022"/>
  <!-- Mât -->
  <rect x="-1" y="-40" width="2" height="84" fill="#b8bcc2"/>
  <rect x="-1" y="-40" width="1" height="84" fill="#d3d7dc"/>
  <rect x="-3" y="-43" width="6" height="3" fill="#8a8d92"/>
  <!-- Socle -->
  <rect x="-5" y="42" width="10" height="3" fill="#7c7e83"/>
