<svg xmlns="http://www.w3.org/2000/svg" viewBox="-32 -44 64 92" shape-rendering="crispEdges">
  <!-- Éclaboussure à la base (sur l'eau) -->
  <rect x="-16" y="42" width="32" height="2" fill="#bfe6f7" opacity="0.6"/>
  <rect x="-14" y="40" width="28" height="3" fill="#cdeefb" opacity="0.85"/>
  <rect x="-9" y="36" width="18" height="4" fill="#9ad4f4"/>
  <!-- Colonne d'eau (haute et fine) -->
  <rect x="-3" y="-40" width="6" height="80" fill="#cfeefb"/>
  <rect x="-2" y="-40" width="3" height="80" fill="#eefaff"/>
  <rect x="2" y="-28" width="1" height="68" fill="#9ad4f4"/>
  <!-- Panache au sommet (s'évase) -->
  <rect x="-5" y="-44" width="10" height="5" fill="#eefaff"/>
  <rect x="-8" y="-41" width="16" height="4" fill="#d7eef9" opacity="0.85"/>
  <rect x="-3" y="-44" width="3" height="2" fill="#ffffff"/>
  <!-- Embruns emportés par le vent -->
  <g fill="#bfe6f7">
    <rect x="7" y="-34" width="2" height="2"/>
    <rect x="9" y="-20" width="2" height="2"/>
    <rect x="-9" y="-10" width="2" height="2"/>
    <rect x="8" y="2" width="2" height="2"/>
    <rect x="-7" y="14" width="2" height="2"/>
  </g>
</svg>
