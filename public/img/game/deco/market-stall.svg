  </g>
  <rect x="13" y="26" width="4" height="3" fill="#e8d23a"/>
  <!-- Reflets -->
  <g fill="#ffffff" opacity="0.7">
    <rect x="-18" y="22" width="1" height="1"/><rect x="-2" y="22" width="1" height="1"/><rect x="14" y="22" width="1" height="1"/>
