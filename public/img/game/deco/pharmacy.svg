<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Plaque blanche (pour que la croix ressorte sur tout fond) -->
  <rect x="6" y="1" width="20" height="15" fill="#2b2b2b"/>
  <rect x="7" y="2" width="18" height="13" fill="#f7f7f7"/>
  <rect x="7" y="2" width="18" height="1" fill="#ffffff"/>

  <!-- Croix verte de pharmacie -->
  <g fill="#0c7a37">
    <rect x="13" y="3" width="6" height="11"/>
    <rect x="9"  y="6" width="14" height="5"/>
  </g>
  <g fill="#21b85a">
    <rect x="14" y="4" width="4" height="9"/>
    <rect x="10" y="7" width="12" height="3"/>
  </g>
  <g fill="#6fe39a">
    <rect x="14" y="4" width="4" height="1"/>
    <rect x="10" y="7" width="1" height="3"/>
  </g>

  <!-- Flacon de médicaments -->
  <rect x="4"  y="17" width="11" height="4" fill="#6b3a0e"/>
  <rect x="5"  y="18" width="9"  height="2" fill="#e67e22"/>
  <rect x="3"  y="20" width="13" height="12" fill="#6b3a0e"/>
  <rect x="4"  y="21" width="11" height="10" fill="#e8a64d"/>
  <rect x="12" y="21" width="3"  height="10" fill="#c47f2a"/>
  <rect x="4"  y="21" width="1"  height="10" fill="#f6c98a"/>
  <!-- Étiquette + croix rouge -->
  <rect x="5"  y="23" width="9" height="6" fill="#fdf6e3"/>
  <rect x="8"  y="24" width="3" height="4" fill="#e23b4e"/>
  <rect x="7"  y="25" width="5" height="2" fill="#e23b4e"/>

  <!-- Gélule bicolore (rouge / blanc) -->
  <rect x="18" y="22" width="13" height="1" fill="#1a1a1a"/>
  <rect x="18" y="29" width="13" height="1" fill="#1a1a1a"/>
  <rect x="17" y="23" width="1"  height="6" fill="#1a1a1a"/>
  <rect x="31" y="23" width="1"  height="6" fill="#1a1a1a"/>
  <rect x="18" y="23" width="6"  height="6" fill="#e23b4e"/>
  <rect x="24" y="23" width="7"  height="6" fill="#f3f3f3"/>
  <rect x="23" y="23" width="1"  height="6" fill="#a8102a"/>
  <rect x="18" y="23" width="6"  height="1" fill="#ff97a6"/>
  <rect x="24" y="23" width="7"  height="1" fill="#ffffff"/>
</svg>
