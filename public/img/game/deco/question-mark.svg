    <rect x="10" y="7" width="14" height="4"/>
    <rect x="19" y="7" width="5" height="9"/>
    <rect x="13" y="14" width="11" height="4"/>
    <rect x="13" y="17" width="5" height="5"/>
    <rect x="13" y="25" width="5" height="5"/>
  </g>
  <!-- Glyphe « ? » jaune -->
  <g fill="#ffd23f">
    <rect x="9"  y="6" width="14" height="4"/>
    <rect x="18" y="6" width="5" height="9"/>
    <rect x="12" y="13" width="11" height="4"/>
    <rect x="12" y="16" width="5" height="5"/>
    <rect x="12" y="24" width="5" height="5"/>
  </g>
  <!-- Reflets clairs -->
  <g fill="#fff1a8">
    <rect x="9"  y="6" width="14" height="1"/>
    <rect x="12" y="13" width="2" height="3"/>
    <rect x="12" y="24" width="2" height="2"/>
  </g>
  <!-- Contour foncé minimal -->
  <g fill="#1c1640">
    <rect x="9"  y="5" width="14" height="1"/>
    <rect x="22" y="6" width="1" height="9"/>
    <rect x="12" y="29" width="5" height="1"/>
