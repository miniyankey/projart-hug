<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Repose-pouce (droite) -->
  <rect x="28" y="10" width="3" height="11" fill="#8a9098"/>
  <rect x="28" y="11" width="3" height="9"  fill="#c2c8cf"/>
  <rect x="28" y="11" width="3" height="1"  fill="#e3e7ec"/>

  <!-- Tige du piston -->
  <rect x="24" y="14" width="5" height="3" fill="#c2c8cf"/>
  <rect x="24" y="15" width="5" height="1" fill="#e3e7ec"/>

  <!-- Corps de la seringue -->
  <rect x="8"  y="11" width="17" height="9" fill="#5f8a99"/>
  <rect x="9"  y="12" width="15" height="7" fill="#dbeefb"/>
  <!-- Liquide -->
  <rect x="9"  y="13" width="12" height="5" fill="#5bbcd6"/>
  <!-- Joint du piston -->
  <rect x="21" y="12" width="2" height="7" fill="#9aa3ab"/>
  <!-- Reflet -->
  <rect x="9"  y="12" width="15" height="1" fill="#ffffff"/>
  <!-- Graduations -->
  <g fill="#5f8a99">
    <rect x="11" y="12" width="1" height="2"/>
    <rect x="13" y="12" width="1" height="2"/>
    <rect x="15" y="12" width="1" height="2"/>
    <rect x="17" y="12" width="1" height="2"/>
    <rect x="19" y="12" width="1" height="2"/>
  </g>

  <!-- Embase + aiguille -->
  <rect x="6"  y="11" width="2" height="9" fill="#c2c8cf"/>
  <rect x="6"  y="11" width="2" height="9" fill="none"/>
  <rect x="5"  y="13" width="1" height="5" fill="#9aa3ab"/>
  <rect x="1"  y="15" width="5" height="1" fill="#cbd1d7"/>
  <rect x="0"  y="15" width="2" height="2" fill="#aeb6bd"/>

  <!-- Goutte au bout de l'aiguille -->
  <g fill="#4aa3e0">
    <rect x="1" y="18" width="2" height="1"/>
    <rect x="0" y="19" width="3" height="2"/>
    <rect x="1" y="21" width="2" height="1"/>
  </g>
  <rect x="1" y="19" width="1" height="2" fill="#bfe3f5"/>
</svg>
