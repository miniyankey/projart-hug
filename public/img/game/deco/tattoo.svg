<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Manche de t-shirt -->
  <rect x="2" y="8"  width="8" height="15" fill="#2f6a86"/>
  <rect x="2" y="9"  width="7" height="13" fill="#4a8fb0"/>
  <rect x="2" y="9"  width="7" height="1"  fill="#6fb0cf"/>
  <rect x="4" y="11" width="1" height="9"  fill="#3f7e9c"/>
  <rect x="8" y="9"  width="1" height="13" fill="#2f6a86"/>

  <!-- Bras (peau) -->
  <rect x="11" y="9"  width="13" height="1" fill="#a86a3c"/>
  <g fill="#e8b48a">
    <rect x="9"  y="10" width="16" height="1"/>
    <rect x="9"  y="11" width="18" height="1"/>
    <rect x="9"  y="12" width="19" height="1"/>
    <rect x="9"  y="13" width="19" height="1"/>
    <rect x="9"  y="14" width="18" height="1"/>
    <rect x="9"  y="15" width="16" height="1"/>
  </g>
  <rect x="9" y="10" width="16" height="1" fill="#f3c9a6"/>
  <rect x="9" y="15" width="15" height="1" fill="#cf9866"/>
  <rect x="10" y="16" width="13" height="1" fill="#a86a3c"/>

  <!-- Poing (à droite) -->
  <g fill="#e8b48a">
    <rect x="24" y="10" width="5" height="6"/>
  </g>
  <rect x="24" y="10" width="5" height="1" fill="#f3c9a6"/>
  <rect x="24" y="15" width="5" height="1" fill="#cf9866"/>
  <g fill="#cf9866">
    <rect x="26" y="11" width="1" height="4"/>
    <rect x="28" y="11" width="1" height="4"/>
  </g>
  <rect x="29" y="11" width="1" height="4" fill="#a86a3c"/>

  <!-- Tatouage : cœur + bannière -->
  <g fill="#1f2a6b">
    <rect x="13" y="11" width="2" height="1"/>
    <rect x="17" y="11" width="2" height="1"/>
    <rect x="12" y="12" width="8" height="1"/>
    <rect x="13" y="13" width="6" height="1"/>
    <rect x="14" y="14" width="4" height="1"/>
    <rect x="15" y="15" width="2" height="1"/>
  </g>
  <rect x="13" y="11" width="1" height="1" fill="#4a5fb0"/>
  <!-- Petit tatouage étoile (avant-bras) -->
  <g fill="#1f2a6b">
    <rect x="22" y="11" width="1" height="3"/>
    <rect x="21" y="12" width="3" height="1"/>
  </g>
</svg>
