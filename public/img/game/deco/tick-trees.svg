<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- ░░ 3 sapins (arrière-plan) ░░ -->
  <!-- Sapin gauche -->
  <rect x="4" y="15" width="2" height="4" fill="#6b4a1a"/>
  <g fill="#1d5527">
    <rect x="4" y="6"  width="2" height="1"/>
    <rect x="2" y="8"  width="6" height="2"/>
    <rect x="1" y="11" width="8" height="3"/>
  </g>
  <g fill="#2f7d3a">
    <rect x="4" y="6"  width="1" height="1"/>
    <rect x="3" y="8"  width="3" height="1"/>
    <rect x="2" y="11" width="4" height="2"/>
  </g>

  <!-- Sapin central (le plus grand) -->
  <rect x="14" y="17" width="2" height="5" fill="#6b4a1a"/>
  <g fill="#1d5527">
    <rect x="14" y="2"  width="2" height="1"/>
    <rect x="12" y="4"  width="6" height="2"/>
    <rect x="11" y="7"  width="8" height="3"/>
    <rect x="10" y="11" width="10" height="3"/>
    <rect x="9"  y="15" width="12" height="3"/>
  </g>
  <g fill="#2f7d3a">
    <rect x="14" y="2"  width="1" height="1"/>
    <rect x="13" y="4"  width="3" height="1"/>
    <rect x="12" y="7"  width="4" height="2"/>
    <rect x="11" y="11" width="5" height="2"/>
    <rect x="10" y="15" width="6" height="2"/>
  </g>

  <!-- Sapin droit -->
  <rect x="25" y="14" width="2" height="4" fill="#6b4a1a"/>
  <g fill="#1d5527">
    <rect x="25" y="4"  width="2" height="1"/>
    <rect x="23" y="6"  width="6" height="2"/>
    <rect x="22" y="9"  width="8" height="3"/>
  </g>
  <g fill="#2f7d3a">
    <rect x="25" y="4"  width="1" height="1"/>
    <rect x="24" y="6"  width="3" height="1"/>
    <rect x="23" y="9"  width="4" height="2"/>
  </g>

  <!-- ░░ Tique (premier plan) ░░ -->
  <!-- Pattes (4 de chaque côté) -->
  <g fill="#241405">
    <rect x="7"  y="20" width="5" height="1"/><rect x="6"  y="19" width="2" height="1"/>
    <rect x="7"  y="23" width="5" height="1"/>
    <rect x="7"  y="26" width="5" height="1"/>
    <rect x="8"  y="28" width="5" height="1"/><rect x="7"  y="29" width="2" height="1"/>
    <rect x="20" y="20" width="5" height="1"/><rect x="24" y="19" width="2" height="1"/>
    <rect x="20" y="23" width="5" height="1"/>
    <rect x="20" y="26" width="5" height="1"/>
    <rect x="19" y="28" width="5" height="1"/><rect x="23" y="29" width="2" height="1"/>
  </g>
  <!-- Corps -->
  <g fill="#241405">
    <rect x="13" y="20" width="6" height="1"/>
    <rect x="12" y="21" width="8" height="8"/>
    <rect x="13" y="29" width="6" height="1"/>
  </g>
  <g fill="#5a3216">
    <rect x="13" y="21" width="6" height="7"/>
  </g>
  <!-- Tête -->
  <rect x="14" y="18" width="4" height="3" fill="#3a2010"/>
  <rect x="15" y="17" width="2" height="1" fill="#3a2010"/>
  <!-- Motif dorsal -->
  <rect x="15" y="23" width="2" height="3" fill="#8a5a2a"/>
  <rect x="14" y="22" width="1" height="1" fill="#8a5a2a"/>
  <rect x="17" y="22" width="1" height="1" fill="#8a5a2a"/>
</svg>
