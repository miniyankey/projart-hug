<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- ░░ Dent (gauche) ░░ -->
  <!-- Contour gris (silhouette pleine) -->
  <g fill="#b9c0c8">
    <rect x="3" y="3"  width="4" height="2"/>
    <rect x="9" y="3"  width="4" height="2"/>
    <rect x="2" y="5"  width="5" height="1"/>
    <rect x="9" y="5"  width="5" height="1"/>
    <rect x="2" y="6"  width="12" height="1"/>
    <rect x="1" y="7"  width="14" height="6"/>
    <rect x="2" y="13" width="12" height="1"/>
    <rect x="2" y="14" width="5" height="3"/>
    <rect x="9" y="14" width="5" height="4"/>
    <rect x="3" y="17" width="3" height="2"/>
    <rect x="10" y="18" width="3" height="2"/>
  </g>
  <!-- Émail blanc (intérieur) -->
  <g fill="#ffffff">
    <rect x="3"  y="4"  width="3" height="1"/>
    <rect x="10" y="4"  width="3" height="1"/>
    <rect x="3"  y="5"  width="4" height="1"/>
    <rect x="9"  y="5"  width="4" height="1"/>
    <rect x="3"  y="6"  width="10" height="1"/>
    <rect x="2"  y="7"  width="12" height="5"/>
    <rect x="3"  y="12" width="10" height="1"/>
    <rect x="3"  y="13" width="3" height="4"/>
    <rect x="10" y="13" width="3" height="5"/>
  </g>
  <!-- Sillon entre les cuspides -->
  <rect x="7" y="3" width="2" height="4" fill="#cdd4db"/>
  <!-- Ombre côté droit + brillance -->
  <rect x="11" y="7" width="2" height="6" fill="#e3e8ee"/>
  <rect x="3"  y="7" width="2" height="3" fill="#ffffff"/>
  <rect x="4"  y="6" width="2" height="1" fill="#f4f9ff"/>

  <!-- ░░ Masque chirurgical (droite) ░░ -->
  <!-- Brides d'oreille -->
  <g fill="#3a6aa8">
    <rect x="17" y="9"  width="1" height="1"/>
    <rect x="16" y="10" width="1" height="6"/>
    <rect x="17" y="16" width="1" height="1"/>
    <rect x="29" y="9"  width="1" height="1"/>
    <rect x="30" y="10" width="1" height="6"/>
    <rect x="29" y="16" width="1" height="1"/>
  </g>
  <!-- Corps du masque -->
  <rect x="18" y="9"  width="11" height="9" fill="#2a4f80"/>
  <g fill="#5b8fd6">
    <rect x="18" y="10" width="11" height="7"/>
    <rect x="19" y="9"  width="9"  height="1"/>
    <rect x="19" y="17" width="9"  height="1"/>
  </g>
  <!-- Pli barre-nez -->
  <rect x="19" y="10" width="9" height="1" fill="#8fb4e6"/>
  <!-- Plis horizontaux -->
  <g fill="#3f6fb0">
    <rect x="18" y="12" width="11" height="1"/>
    <rect x="18" y="14" width="11" height="1"/>
    <rect x="18" y="16" width="11" height="1"/>
  </g>
</svg>
